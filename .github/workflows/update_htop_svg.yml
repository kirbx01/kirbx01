name: Update kirbx01 htop SVG
on:
  schedule:
    - cron: '0 * * * *'  
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install requests pillow
      - name: Run SVG Generation Script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python .github/scripts/update_svg.py
      - name: Run welcome bear gif script
        run: python .github/scripts/welcome.py
      - name: Commit and push if files changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add profile-htop.svg welcome.gif
          # Check if there are changes to commit
          if git diff-index --quiet HEAD --; then
            echo "No changes to files, skipping commit."
          else
            git commit -m "Update dynamic profile assets [Bot]"
            git push
          fi
