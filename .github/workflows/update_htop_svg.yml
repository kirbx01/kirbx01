name: Update kirbx01 htop SVG

on:
  schedule:
    - cron: '0 */12 * * *' 
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  update-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run SVG Generation Script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }} 
        run: python .github/scripts/update_svg.py

      - name: Commit and push if SVG changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add profile-htop.svg
          # Check if there are changes to commit
          if git diff-index --quiet HEAD --; then
            echo "No changes to SVG file, skipping commit."
          else
            git commit -m "Update dynamic htop profile SVG [Bot]"
            git push
          fi
